# Firecrawl MCP bridge via the CLI-shipped mcp-client.
# Enabled only when FIRECRAWL_API_KEY is present in the launch environment
# (a real env var, the project .env, or $DSH_HOME/.env). The key must never
# sit in plain YAML: it is interpolated into the Authorization header at load time.
- insert:
    - id: mcp-firecrawl
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js process.env.FIRECRAWL_API_KEY === undefined
      config:
        serverName: firecrawl
        transport: streamable-http
        url: https://mcp.firecrawl.dev/v2/mcp
        headers:
          Authorization: !!js "'Bearer ' + (process.env.FIRECRAWL_API_KEY ?? '')"
        toolCallTimeoutMs: 60000
        failOnStartupError: false
