# Tavily web-search provider: the searchProvider switch keeps official
# DeepSeek as the fallback inside our provider (one searchProvider write on rc.6).
# An id-targeted override replaces the entry's whole `config`, so dsh-base's
# fetchProvider is restated; without it a second fetch provider would make
# web fetch fail as WEB_PROVIDER_AMBIGUOUS.
- id: web
  config:
    searchProvider: tavily
    fetchProvider: http

- insert:
    - id: web-search-tavily
      name: '@pymodel/dsh-tavily'

# Tavily MCP bridge (search / extract / crawl / map / research) via the CLI-shipped mcp-client.
# Keyed: TAVILY_API_KEY from the launch environment (a real env var, the project
# .env, or $DSH_HOME/.env) goes into the Authorization header — never into the
# URL, where it would leak into logs and proxies. Keyless: the required
# X-Tavily-Access-Mode: keyless header selects free rate-limited access to search
# and extract only (crawl / map / research need a key). The key
# must never sit in plain YAML; it is interpolated into the header at load time.
- insert:
    - id: mcp-tavily
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: tavily
        transport: streamable-http
        url: https://mcp.tavily.com/mcp/
        headers: !!js "(process.env.TAVILY_API_KEY ? { Authorization: 'Bearer ' + process.env.TAVILY_API_KEY } : { 'X-Tavily-Access-Mode': 'keyless' })"
        # tavily_research (keyed) runs for minutes; 60 s cut it off mid-report.
        toolCallTimeoutMs: 600000
        failOnStartupError: false
